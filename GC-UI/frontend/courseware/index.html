<!doctype html>
<html lang="zh-CN">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: blob:; connect-src 'self' file: data: blob:; img-src 'self' file: data: blob:; media-src 'self' file: data: blob:; font-src 'self' data:; style-src 'unsafe-inline' 'self' file: data:; script-src 'unsafe-inline' 'self' file: data: blob:; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; worker-src 'none'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d7ecff">
  <title>等高线地形——五大典型地貌判读</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="app-shell" id="app-shell">
    <section class="media-stage" aria-label="等高线实验观察区">
      <video
        class="stage-media stage-video is-visible"
        id="experiment-video"
        src="assets/contour-formation.mp4"
        preload="auto"
        playsinline
        aria-label="等高线形成交线实验视频"
      ></video>
      <img
        class="stage-media stage-image workflow-step-background"
        id="density-background"
        src="assets/density-background.jpg"
        alt="山体两侧以疏密不同的等高线对比坡度"
        decoding="async"
      >
      <img class="stage-media stage-image" id="landform-image" alt="" decoding="async">
      <img class="stage-media stage-image stage-top-image" id="landform-top-image" alt="" decoding="async">
      <div class="media-shade" aria-hidden="true"></div>
      <div class="scan-effect" id="scan-effect" aria-hidden="true">
        <span class="scan-grid"></span>
        <span class="scan-beam"></span>
      </div>
      <svg
        class="workflow-diagram workflow-diagram--projection"
        id="projection-diagram"
        viewBox="0 0 300 455"
        role="img"
        aria-labelledby="projection-diagram-title projection-diagram-description"
        hidden
      >
        <title id="projection-diagram-title">垂直投影</title>
        <desc id="projection-diagram-description">立体山体上的多层等高交线沿垂线投影到同一平面，形成平面等高线。</desc>
        <defs>
          <linearGradient id="projection-card-fill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".94"/>
            <stop offset="1" stop-color="#edf7ff" stop-opacity=".88"/>
          </linearGradient>
          <linearGradient id="projection-beam" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="340">
            <stop offset="0" stop-color="#26c7ff" stop-opacity=".18"/>
            <stop offset=".42" stop-color="#1089ff" stop-opacity=".72"/>
            <stop offset="1" stop-color="#126fff" stop-opacity=".96"/>
          </linearGradient>
          <linearGradient id="projection-layer-stroke" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#3a7fff"/>
            <stop offset=".5" stop-color="#31d8ff"/>
            <stop offset="1" stop-color="#3a7fff"/>
          </linearGradient>
          <linearGradient id="projection-plane-fill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#eaf7ff" stop-opacity=".64"/>
            <stop offset="1" stop-color="#b9ddff" stop-opacity=".20"/>
          </linearGradient>
          <filter id="projection-card-shadow" x="-30%" y="-20%" width="160%" height="160%">
            <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#052b50" flood-opacity=".20"/>
          </filter>
          <filter id="projection-glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="2.6" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <marker id="projection-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M1 1 7 4 1 7" fill="none" stroke="#147dff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
        </defs>
        <rect class="diagram-card" x="3" y="3" width="294" height="449" rx="17" fill="url(#projection-card-fill)" filter="url(#projection-card-shadow)"/>
        <text class="diagram-heading" x="20" y="38">垂直投影</text>
        <g class="projection-stack" filter="url(#projection-glow)">
          <ellipse class="projection-layer" style="--i:0" cx="150" cy="64" rx="43" ry="10"/>
          <ellipse class="projection-layer" style="--i:1" cx="150" cy="84" rx="58" ry="12"/>
          <ellipse class="projection-layer" style="--i:2" cx="150" cy="105" rx="75" ry="13"/>
          <ellipse class="projection-layer" style="--i:3" cx="150" cy="126" rx="94" ry="15"/>
          <ellipse class="projection-layer" style="--i:4" cx="150" cy="148" rx="111" ry="16"/>
          <ellipse class="projection-layer" style="--i:5" cx="150" cy="170" rx="126" ry="18"/>
        </g>
        <g class="projection-columns">
          <line class="projection-column" x1="49" y1="166" x2="49" y2="347" marker-end="url(#projection-arrow)"/>
          <line class="projection-column" x1="65" y1="154" x2="65" y2="331" marker-end="url(#projection-arrow)"/>
          <line class="projection-column" x1="83" y1="139" x2="83" y2="323" marker-end="url(#projection-arrow)"/>
          <line class="projection-column" x1="103" y1="121" x2="103" y2="331" marker-end="url(#projection-arrow)"/>
          <line class="projection-column" x1="125" y1="101" x2="125" y2="338" marker-end="url(#projection-arrow)"/>
          <line class="projection-column" x1="150" y1="73" x2="150" y2="347" marker-end="url(#projection-arrow)"/>
          <line class="projection-column" x1="175" y1="101" x2="175" y2="338" marker-end="url(#projection-arrow)"/>
          <line class="projection-column" x1="197" y1="121" x2="197" y2="331" marker-end="url(#projection-arrow)"/>
          <line class="projection-column" x1="217" y1="139" x2="217" y2="323" marker-end="url(#projection-arrow)"/>
          <line class="projection-column" x1="235" y1="154" x2="235" y2="331" marker-end="url(#projection-arrow)"/>
          <line class="projection-column" x1="251" y1="166" x2="251" y2="347" marker-end="url(#projection-arrow)"/>
          <g class="projection-crossings" filter="url(#projection-glow)">
            <circle cx="65" cy="154" r="2.4"/><circle cx="83" cy="139" r="2.4"/><circle cx="103" cy="121" r="2.4"/>
            <circle cx="125" cy="101" r="2.4"/><circle cx="150" cy="73" r="2.4"/><circle cx="175" cy="101" r="2.4"/>
            <circle cx="197" cy="121" r="2.4"/><circle cx="217" cy="139" r="2.4"/><circle cx="235" cy="154" r="2.4"/>
          </g>
        </g>
        <g class="projection-plane">
          <polygon points="34,300 266,300 285,395 15,395" fill="url(#projection-plane-fill)" stroke="#7fa6d4" stroke-width="1.1"/>
          <path class="projection-grid" d="M30 318h240M26 340h248M22 365h256M19 383h262M63 300 48 395M91 300l-8 95M121 300l-3 95M150 300v95M179 300l3 95M209 300l8 95M237 300l15 95"/>
          <ellipse class="projection-contour" style="--i:0" cx="150" cy="347" rx="101" ry="43"/>
          <ellipse class="projection-contour" style="--i:1" cx="150" cy="347" rx="79" ry="34"/>
          <ellipse class="projection-contour" style="--i:2" cx="150" cy="347" rx="59" ry="27"/>
          <ellipse class="projection-contour" style="--i:3" cx="150" cy="347" rx="42" ry="20"/>
          <ellipse class="projection-contour" style="--i:4" cx="150" cy="347" rx="24" ry="12"/>
          <ellipse class="projection-contour" style="--i:5" cx="150" cy="347" rx="11" ry="6"/>
          <g class="projection-landings" filter="url(#projection-glow)">
            <circle cx="49" cy="347" r="2.8"/><circle cx="65" cy="331" r="2.8"/><circle cx="83" cy="323" r="2.8"/>
            <circle cx="103" cy="331" r="2.8"/><circle cx="125" cy="338" r="2.8"/><circle cx="150" cy="347" r="2.8"/>
            <circle cx="175" cy="338" r="2.8"/><circle cx="197" cy="331" r="2.8"/><circle cx="217" cy="323" r="2.8"/>
            <circle cx="235" cy="331" r="2.8"/><circle cx="251" cy="347" r="2.8"/>
          </g>
        </g>
        <text class="diagram-footer" x="150" y="431" text-anchor="middle">立体交线 → 平面等高线</text>
      </svg>

      <svg
        class="workflow-diagram workflow-diagram--density"
        id="density-diagram"
        viewBox="0 0 368 283"
        role="img"
        aria-labelledby="density-diagram-title density-diagram-description"
        hidden
      >
        <title id="density-diagram-title">疏密判坡</title>
        <desc id="density-diagram-description">等高线稀疏的一侧坡缓，等高线密集的一侧坡陡。</desc>
        <defs>
          <linearGradient id="density-card-fill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".94"/>
            <stop offset="1" stop-color="#edf7ff" stop-opacity=".88"/>
          </linearGradient>
          <linearGradient id="density-contour-stroke" gradientUnits="userSpaceOnUse" x1="95" y1="0" x2="320" y2="0">
            <stop offset="0" stop-color="#1587ff"/>
            <stop offset=".50" stop-color="#3e95ff"/>
            <stop offset=".64" stop-color="#f0a43d"/>
            <stop offset="1" stop-color="#ff8517"/>
          </linearGradient>
          <filter id="density-card-shadow" x="-30%" y="-35%" width="160%" height="180%">
            <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#052b50" flood-opacity=".20"/>
          </filter>
          <filter id="density-dot-glow" x="-120%" y="-120%" width="340%" height="340%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <path id="density-contour-shape" d="M342 164C342 111 309 75 258 65c-32-6-49-3-80-12-27-7-45 8-67 13-27 6-47 4-64 18-21 17-29 41-24 67 5 23 25 33 53 33 29 1 42 24 67 42 25 19 59 29 107 27 55-2 90-35 92-89Z"/>
        </defs>
        <rect class="diagram-card" x="3" y="3" width="362" height="277" rx="17" fill="url(#density-card-fill)" filter="url(#density-card-shadow)"/>
        <text class="diagram-heading" x="20" y="38">疏密判坡</text>
        <g class="density-contours">
          <use class="density-contour" style="--i:0" href="#density-contour-shape"/>
          <use class="density-contour" style="--i:1" href="#density-contour-shape" transform="translate(273 164) scale(.84) translate(-273 -164)"/>
          <use class="density-contour" style="--i:2" href="#density-contour-shape" transform="translate(273 164) scale(.70) translate(-273 -164)"/>
          <use class="density-contour" style="--i:3" href="#density-contour-shape" transform="translate(273 164) scale(.58) translate(-273 -164)"/>
          <use class="density-contour" style="--i:4" href="#density-contour-shape" transform="translate(273 164) scale(.47) translate(-273 -164)"/>
          <use class="density-contour" style="--i:5" href="#density-contour-shape" transform="translate(273 164) scale(.37) translate(-273 -164)"/>
          <use class="density-contour" style="--i:6" href="#density-contour-shape" transform="translate(273 164) scale(.29) translate(-273 -164)"/>
          <use class="density-contour" style="--i:7" href="#density-contour-shape" transform="translate(273 164) scale(.22) translate(-273 -164)"/>
          <use class="density-contour" style="--i:8" href="#density-contour-shape" transform="translate(273 164) scale(.15) translate(-273 -164)"/>
        </g>
        <g class="density-callout density-callout--gentle">
          <rect x="14" y="211" width="116" height="37" rx="8"/>
          <path d="M60 190 52 207"/>
          <circle cx="60" cy="190" r="7"/>
          <text x="22" y="236">线疏 · 坡缓</text>
        </g>
        <g class="density-callout density-callout--steep">
          <rect x="257" y="50" width="100" height="37" rx="8"/>
          <path d="M293 125 307 88"/>
          <circle cx="293" cy="125" r="7"/>
          <text x="266" y="75">线密 · 坡陡</text>
        </g>
      </svg>
      <div class="terrain-annotation" id="terrain-annotation" hidden>
        <canvas id="terrain-annotation-canvas" aria-hidden="true"></canvas>
        <svg class="terrain-callout-connector" id="terrain-callout-connector" aria-hidden="true" preserveAspectRatio="none">
          <polygon id="terrain-callout-connector-shape"></polygon>
        </svg>
        <div class="terrain-callout" id="terrain-callout" role="status" aria-live="polite">
          <span class="terrain-callout-kicker">动态判读</span>
          <strong id="terrain-callout-title"></strong>
          <p id="terrain-callout-copy"></p>
        </div>
      </div>
      <div class="media-loading" id="media-loading" role="status">
        <span class="loading-ring"></span>
        <span>实验影像加载中</span>
      </div>
      <div class="media-label" id="media-label" aria-live="polite">
        <span class="media-label-kicker" id="media-label-kicker">实验流程</span>
        <strong id="media-label-title">形成交线与垂直投影</strong>
        <small id="media-label-copy">点击“开始实验”，直接在当前画面播放形成交线视频</small>
      </div>
      <div class="video-progress" aria-hidden="true"><span id="video-progress-fill"></span></div>
    </section>

    <header class="topbar">
      <div class="heading-group">
        <span class="subject-chip">高中地理</span>
        <div class="heading-copy">
          <h1>等高线地形——五大典型地貌判读</h1>
          <p>观察水平切割、垂直投影与等高线地貌特征</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="glass-button" id="workflow-open" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H11v17H7.5A3.5 3.5 0 0 0 4 22V5.5Zm16 0A3.5 3.5 0 0 0 16.5 2H13v17h3.5a3.5 3.5 0 0 1 3.5 3V5.5Z"/></svg>
          <span>实验流程</span>
        </button>
        <button class="glass-button" id="fullscreen-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5"/></svg>
          <span id="fullscreen-label">全屏</span>
        </button>
      </div>
    </header>

    <aside class="control-panel" aria-labelledby="panel-title">
      <div class="panel-scroll">
        <section class="flow-section">
          <div class="section-heading">
            <h2 id="panel-title">实验流程 · <span id="flow-count">1/4</span></h2>
            <button class="panel-close" id="panel-close" type="button" aria-label="收起观察面板">×</button>
          </div>
          <div class="flow-track" id="flow-track">
            <span class="flow-line" aria-hidden="true"><i id="flow-line-fill"></i></span>
            <button class="flow-step is-active" type="button" data-step="0" aria-label="查看步骤一：等高切割">
              <span class="step-dot">1</span><span class="step-name">等高切割</span>
            </button>
            <button class="flow-step" type="button" data-step="1" aria-label="查看步骤二：形成交线">
              <span class="step-dot">2</span><span class="step-name">形成交线</span>
            </button>
            <button class="flow-step" type="button" data-step="2" aria-label="查看步骤三：投影成图">
              <span class="step-dot">3</span><span class="step-name">投影成图</span>
            </button>
            <button class="flow-step" type="button" data-step="3" aria-label="查看步骤四：疏密判坡">
              <span class="step-dot">4</span><span class="step-name">疏密判坡</span>
            </button>
          </div>
        </section>

        <section class="glass-card task-card" aria-labelledby="task-title">
          <span class="card-eyebrow">当前步骤</span>
          <h3 id="task-title">等高切割</h3>
          <p id="task-description">观察水平面与山体在同一海拔相交，形成连续闭合线。</p>
          <div class="fixed-condition" aria-label="实验固定条件">
            <span><i></i>水平切面</span>
            <strong>等高距 d = 10 m</strong>
          </div>
        </section>

        <section class="glass-card terrain-card" aria-labelledby="terrain-title">
          <div class="card-title-row">
            <span class="card-eyebrow" id="terrain-title">典型地貌</span>
            <button class="text-action" id="return-experiment" type="button" hidden>返回实验</button>
          </div>
          <div class="terrain-tabs" id="terrain-tabs" role="list" aria-label="五大典型地貌">
            <button class="terrain-tab" type="button" data-landform="peak" aria-pressed="false">
              <svg viewBox="0 0 42 34" aria-hidden="true"><path d="M4 29 16 9l5 8 5-12 12 24H4Z"/><path d="m20 19 4 6h-8l4-6Z" class="solid"/></svg>
              <span>山峰</span>
            </button>
            <button class="terrain-tab" type="button" data-landform="ridge" aria-pressed="false">
              <svg viewBox="0 0 42 34" aria-hidden="true"><path d="M3 29 12 9l7 5 7-10 13 25"/><path d="M10 28c5-7 9-10 14-11"/></svg>
              <span>山脊</span>
            </button>
            <button class="terrain-tab" type="button" data-landform="valley" aria-pressed="false">
              <svg viewBox="0 0 42 34" aria-hidden="true"><path d="M4 6c8 4 12 12 17 24C26 18 30 10 38 6"/><path d="M21 11v19" class="accent"/></svg>
              <span>山谷</span>
            </button>
            <button class="terrain-tab" type="button" data-landform="saddle" aria-pressed="false">
              <svg viewBox="0 0 42 34" aria-hidden="true"><path d="M4 25V8h10l7 8 7-8h10v17"/><path d="M14 9c0 6 2 9 7 9s7-3 7-9"/></svg>
              <span>鞍部</span>
            </button>
            <button class="terrain-tab" type="button" data-landform="cliff" aria-pressed="false">
              <svg viewBox="0 0 42 34" aria-hidden="true"><path d="M7 29V5h17l10 8v16"/><path d="M11 11h18M11 16h21M11 21h22"/></svg>
              <span>陡崖</span>
            </button>
          </div>
        </section>

        <section class="glass-card observation-card" aria-labelledby="observation-heading">
          <div class="observation-copy">
            <span class="card-eyebrow">当前观察</span>
            <h3 id="observation-heading">实验演示</h3>
            <p id="observation-summary">点击开始实验，在当前背景中观察等高切割、交线形成与垂直投影。</p>
            <ul class="feature-list" id="feature-list">
              <li>同一条等高线上海拔相等</li>
              <li>相邻等高线高差保持一致</li>
            </ul>
          </div>
          <button class="top-view-card" id="top-view-toggle" type="button" disabled aria-pressed="false">
            <span id="top-view-toggle-label">俯视图</span>
            <small id="top-view-toggle-hint">选择地貌后切换</small>
            <img id="top-view-thumbnail" alt="" decoding="async" hidden>
          </button>
        </section>
      </div>
    </aside>

    <button class="panel-open" id="panel-open" type="button" aria-label="展开观察面板" hidden>
      <span></span><span></span><span></span>
    </button>

    <div class="experiment-actions">
      <button class="primary-button" id="play-button" type="button">
        <span class="round-icon" id="play-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="m9 6 9 6-9 6V6Z"/></svg>
        </span>
        <span id="play-label">开始实验</span>
      </button>
      <button class="glass-button reset-button" id="reset-button" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6M5.4 15.5A8 8 0 1 0 6 7"/></svg>
        <span>重置</span>
      </button>
    </div>

    <div class="hint-bar" id="hint-bar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7h.01"/></svg>
      <span id="hint-text">点击“开始实验”，观看形成交线视频</span>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="assets/three.min.js"></script>
  <script src="assets/terrain-annotation.js"></script>
  <script src="assets/app.js"></script>

    
    </body>
</html>
