# ---------------------------------------------------------------------------
# 发布一致性核对（Gitea Actions）
#
# 触发：仅手动。发布前跑一次确认「tag / 清单 / 资产」互相对得上，发布后再跑一次
#       确认线上资产就是清单里那两份。
#
# 为什么不用 pull_request 触发：这里要下载几百 MB 的发布包，PR 阶段跑太贵；
# 需要时点 Run workflow 即可，本地也有等价命令：./build.sh release-verify <tag>
# ---------------------------------------------------------------------------
name: 发布核对

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要核对的 tag（如 1.1.0）'
        required: true
      skip_download:
        description: '只比对体积、不下载校验 sha256（快，输入 1 开启）'
        required: false
        default: ''

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  verify:
    name: 核对 Release 与清单
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 核对
        env:
          GC_GITEA_TOKEN: ${{ secrets.GC_GITEA_TOKEN }}
        run: |
          set -eu
          EXTRA=""
          if [ -n "${{ github.event.inputs.skip_download }}" ]; then
            EXTRA="--skip-download"
          fi
          chmod +x buildsh/lib/verify_release.py
          ./build.sh release-verify "${{ github.event.inputs.tag }}" $EXTRA
